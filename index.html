<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBLULIS X ANABOZO</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:       #cc0000;
            --red-dark:  #8b0000;
            --red-light: #ff4444;
            --green:     #009c3b;
            --yellow:    #ffdf00;
            --green-dark:#006622;
            --bg:        #1a1a1a;
            --card:      #222;
            --border:    #444;
            --white:     #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(204,0,0,.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0,156,59,.15) 0%, transparent 50%);
            min-height: 100vh;
            font-family: 'Oswald', sans-serif;
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            padding: 24px 16px 12px;
            width: 100%;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .title-p1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.4em, 8vw, 4.5em);
            color: var(--red);
            text-shadow: 0 0 20px rgba(204,0,0,.6), 3px 3px 0 #600;
            letter-spacing: 4px;
        }
        .title-vs {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.6em, 5vw, 3em);
            color: var(--yellow);
            text-shadow: 0 0 15px rgba(255,223,0,.5), 2px 2px 0 #a08000;
        }
        .title-p2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.4em, 8vw, 4.5em);
            color: var(--green);
            text-shadow: 0 0 20px rgba(0,156,59,.6), 3px 3px 0 #003;
            letter-spacing: 4px;
        }
        .subtitle {
            font-family: 'Special Elite', serif;
            font-size: clamp(.8em, 2vw, 1em);
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0;
            font-size: 1.4em;
            opacity: .7;
        }
        .divider::before,.divider::after {
            content:'';
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #666, transparent);
        }

        /* ── SCREENS ── */
        .screen { display: none; width: 100%; max-width: 860px; padding: 16px; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        /* ── SETUP ── */
        .setup-players {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .player-card {
            border-radius: 16px;
            padding: 20px 16px 16px;
            text-align: center;
            width: 200px;
            position: relative;
            transition: transform .2s;
        }
        .player-card:hover { transform: translateY(-3px); }
        .player-card.p1 {
            background: linear-gradient(160deg, #3a0000, #1a0000);
            border: 2px solid var(--red);
            box-shadow: 0 0 20px rgba(204,0,0,.3);
        }
        .player-card.p2 {
            background: linear-gradient(160deg, #003a10, #001a08);
            border: 2px solid var(--green);
            box-shadow: 0 0 20px rgba(0,156,59,.3);
        }
        .card-label {
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 16px;
            border-radius: 20px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1em;
            letter-spacing: 3px;
            white-space: nowrap;
        }
        .p1 .card-label { background: var(--red); color: #fff; }
        .p2 .card-label { background: var(--green); color: #fff; }

        .avatar-wrap {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 14px;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid transparent;
            transition: all .2s;
            position: relative;
            background: #333;
        }
        .p1 .avatar-wrap { border-color: var(--red); }
        .p2 .avatar-wrap { border-color: var(--green); }
        .avatar-wrap:hover { transform: scale(1.05); }
        .p1 .avatar-wrap:hover { box-shadow: 0 0 20px rgba(204,0,0,.6); }
        .p2 .avatar-wrap:hover { box-shadow: 0 0 20px rgba(0,156,59,.6); }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,.6);
            font-size: .65em;
            padding: 4px;
            text-align: center;
            letter-spacing: 1px;
        }
        input[type=file] { display: none; }

        .player-name-input {
            width: 100%;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3em;
            letter-spacing: 2px;
            text-align: center;
        }
        .p1 .player-name-input { background: rgba(204,0,0,.2); color: var(--red-light); border: 1px solid var(--red); }
        .p2 .player-name-input { background: rgba(0,156,59,.2); color: #44ff88; border: 1px solid var(--green); }

        /* ── BUTTON ── */
        .btn {
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6em;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(204,0,0,.4);
            transition: all .2s;
            margin-top: 12px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(204,0,0,.6); }
        .btn-sm { padding: 8px 22px; font-size: 1.1em; margin-top: 6px; }
        .btn-gray {
            background: linear-gradient(135deg, #555, #333);
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
        }
        .btn-gray:hover { box-shadow: 0 6px 18px rgba(0,0,0,.6); }
        .side-selector {
            display: none;
            gap: 14px;
            justify-content: center;
            margin: 8px 0 4px;
            flex-wrap: wrap;
        }
        .side-selector.show { display: flex; }
        .side-btn {
            background: #2a2a2a;
            border: 2px solid #555;
            color: #aaa;
            padding: 10px 24px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1em;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
        }
        .side-btn.p1-side:hover, .side-btn.p1-side.selected {
            background: linear-gradient(135deg, #3a0000, #1a0000);
            border-color: var(--red);
            color: var(--red-light);
            box-shadow: 0 0 12px rgba(204,0,0,.3);
        }
        .side-btn.p2-side:hover, .side-btn.p2-side.selected {
            background: linear-gradient(135deg, #003a10, #001a08);
            border-color: var(--green);
            color: #44ff88;
            box-shadow: 0 0 12px rgba(0,156,59,.3);
        }
        /* ── DIFFICULTY SELECTOR ── */
        .diff-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 10px 0 4px;
        }
        .diff-selector.show { display: flex; }
        .diff-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .diff-btn {
            background: #2a2a2a;
            border: 2px solid #555;
            color: #aaa;
            padding: 10px 20px 6px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.05em;
            letter-spacing: 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            text-align: center;
            min-width: 110px;
        }
        .diff-btn .diff-sub {
            display: block;
            font-family: 'Special Elite', serif;
            font-size: .55em;
            letter-spacing: 1px;
            font-weight: normal;
            margin-top: 2px;
            color: #666;
        }
        .diff-btn:hover { border-color: #888; color: #ccc; }
        .diff-btn:hover .diff-sub { color: #999; }
        .diff-btn.selected.fudiav { border-color: #ff6b6b; color: #ff6b6b; background: #2a0a0a; }
        .diff-btn.selected.fudiav .diff-sub { color: #cc4444; }
        .diff-btn.selected.solz   { border-color: var(--yellow); color: var(--yellow); background: #2a2000; }
        .diff-btn.selected.solz   .diff-sub { color: #aa9000; }
        .diff-btn.selected.rr     { border-color: #ff4444; color: #ff4444; background: #2a0000; box-shadow: 0 0 14px rgba(255,0,0,.3); }
        .diff-btn.selected.rr     .diff-sub { color: #cc2222; }

        .cpu-badge {
            display: inline-block;
            background: #333;
            border: 1px solid var(--yellow);
            color: var(--yellow);
            font-size: .65em;
            padding: 1px 7px;
            border-radius: 10px;
            vertical-align: middle;
            margin-left: 4px;
            letter-spacing: 1px;
        }

        /* ── GAME ── */
        .game-container { width: 100%; max-width: 540px; }

        .players-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .p-info { display: flex; align-items: center; gap: 10px; transition: all .3s; }
        .p-info.active { transform: scale(1.06); }
        .p-info.active .p-photo { box-shadow: 0 0 0 3px var(--yellow), 0 0 16px rgba(255,223,0,.5); }
        .p-info.p2-info { flex-direction: row-reverse; text-align: right; }
        .p-photo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; transition: box-shadow .3s; }
        .p-info.p1-info .p-photo { border: 2px solid var(--red); }
        .p-info.p2-info .p-photo { border: 2px solid var(--green); }
        .p-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1em;
            letter-spacing: 2px;
        }
        .p1-info .p-name { color: var(--red-light); }
        .p2-info .p-name { color: #44ff88; }
        .p-score {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8em;
            color: var(--yellow);
        }
        .vs-badge {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4em;
            color: #666;
        }

        .turn-msg {
            text-align: center;
            font-family: 'Special Elite', serif;
            font-style: italic;
            font-size: 1.25em;
            color: var(--yellow);
            text-shadow: 0 0 12px rgba(255,223,0,.5);
            margin: 8px 0;
            min-height: 1.6em;
        }

        /* ── BOARD ── */
        .board {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 6px;
            background: #111;
            border: 5px solid #333;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,.6);
            max-width: 420px;
            margin: 0 auto;
        }
        .cell {
            background: #1e1e1e;
            border-radius: 8px;
            aspect-ratio: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            overflow: hidden;
            position: relative;
        }
        .cell:hover:not(.taken) { background: #2a2a2a; }
        .cell.taken { cursor: not-allowed; }
        .cell.winner-cell { animation: winPulse .5s ease-in-out infinite alternate; }
        @keyframes winPulse {
            from { box-shadow: inset 0 0 0 rgba(255,223,0,0); }
            to   { box-shadow: inset 0 0 24px rgba(255,223,0,.7); background: #2a2500; }
        }
        .cell-img {
            width: 88%;
            height: 88%;
            border-radius: 50%;
            object-fit: cover;
            animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn {
            from { transform: scale(0) rotate(-10deg); opacity: 0; }
            to   { transform: scale(1) rotate(0deg);  opacity: 1; }
        }

        /* ── HISTORY ── */
        .history {
            text-align: center;
            margin-top: 8px;
            font-size: .8em;
            color: #666;
            font-family: 'Special Elite', serif;
        }

        /* ── VICTORY ── */
        .victory-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .victory-overlay.show { display: flex; }
        .victory-box {
            background: #111;
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            max-width: 380px;
            width: 92%;
            animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
        }
        .victory-box.win-p1 { border: 3px solid var(--red); box-shadow: 0 0 40px rgba(204,0,0,.5); }
        .victory-box.win-p2 { border: 3px solid var(--green); box-shadow: 0 0 40px rgba(0,156,59,.5); }
        .victory-box.win-draw { border: 3px solid #666; box-shadow: 0 0 30px rgba(255,255,255,.1); }
        .victory-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2em;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }
        .win-p1 .victory-title { color: var(--red-light); }
        .win-p2 .victory-title { color: #44ff88; }
        .win-draw .victory-title { color: var(--yellow); }
        .victory-illustration {
            width: 220px;
            height: 200px;
            margin: 8px auto;
            display: block;
            animation: bounceIn .6s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes bounceIn {
            from { transform: scale(0) rotate(-15deg); opacity:0; }
            to   { transform: scale(1) rotate(0deg);  opacity:1; }
        }
        @keyframes floatMoney {
            0%,100% { transform: translateY(0) rotate(var(--r)); }
            50%      { transform: translateY(-10px) rotate(var(--r)); }
        }
        @keyframes wag {
            0%,100% { transform-origin: left center; transform: rotate(0deg); }
            25%      { transform: rotate(20deg); }
            75%      { transform: rotate(-20deg); }
        }
        .victory-msg {
            font-family: 'Special Elite', serif;
            font-size: 1em;
            color: #bbb;
            margin: 8px 0 14px;
            font-style: italic;
        }
        .icons-row { font-size: 1.8em; margin: 6px 0; }

        /* ── CONFETTI ── */
        .confetti-piece {
            position: fixed;
            width: 10px; height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 200;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            to   { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 500px) {
            .setup-players { flex-direction: column; align-items: center; }
            .player-card { width: 180px; }
        }
    </style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="screen-setup" class="screen active">
    <div class="header">
        <div class="title-row">
            <span class="title-p1">JBLULIS</span>
            <span class="title-vs">X</span>
            <span class="title-p2">ANABOZO</span>
        </div>
        <div class="subtitle">O Duelo Definitivo das Figurinhas</div>
        <div class="divider">⚽</div>
    </div>

    <div class="setup-players">
        <div class="player-card p1">
            <div class="card-label">JOGADORA 1</div>
            <div class="avatar-wrap" onclick="document.getElementById('file1').click()">
                <img id="avatar1" alt="Calulis">
                <div class="avatar-overlay">📸 Trocar</div>
            </div>
            <input type="file" id="file1" accept="image/*" onchange="loadPhoto(event,1)">
            <input type="text" class="player-name-input" id="name1" value="JBLULIS">
        </div>

        <div class="player-card p2">
            <div class="card-label">JOGADORA 2</div>
            <div class="avatar-wrap" onclick="document.getElementById('file2').click()">
                <img id="avatar2" alt="Cabozo">
                <div class="avatar-overlay">📸 Trocar</div>
            </div>
            <input type="file" id="file2" accept="image/*" onchange="loadPhoto(event,2)">
            <input type="text" class="player-name-input" id="name2" value="ANABOZO">
        </div>
    </div>

    <div style="text-align:center; margin-top:12px;">
        <div class="side-selector show" id="side-selector">
            <div style="width:100%; text-align:center; font-family:'Special Elite',serif; color:#888; font-size:.8em; letter-spacing:3px; margin-bottom:6px;">JOGAR COM:</div>
            <button class="side-btn p1-side selected" id="btn-side1" onclick="selectSide(1)">🔴 JBLULIS</button>
            <button class="side-btn p2-side" id="btn-side2" onclick="selectSide(2)">💚 ANABOZO</button>
        </div>
        <div class="diff-selector show" id="diff-selector">
            <div style="font-family:'Special Elite',serif; color:#888; font-size:.8em; letter-spacing:3px; margin-bottom:2px;">NÍVEL DE DIFICULDADE:</div>
            <div class="diff-btns">
                <button class="diff-btn fudiav" id="btn-fudiav" onclick="selectDiff('fudiav')">
                    🥚🤓 FUDISVAl
                    <span class="diff-sub">Nem sabe o que tá fazendo</span>
                </button>
                <button class="diff-btn solz selected" id="btn-solz" onclick="selectDiff('solz')">
                    ☀️ SOLZINHO
                    <span class="diff-sub">Normal</span>
                </button>
                <button class="diff-btn rr" id="btn-rr" onclick="selectDiff('rr')">
                    💀 RR
                    <span class="diff-sub">Impossível vencer</span>
                </button>
            </div>
        </div>
    </div>
    <button class="btn" onclick="startGame()">⚽ JOGAR! ⚽</button>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
    <div class="header">
        <div class="title-row">
            <span class="title-p1">JBLULIS</span>
            <span class="title-vs">X</span>
            <span class="title-p2">ANABOZO</span>
        </div>
    </div>

    <div class="game-container">
        <div class="players-bar">
            <div class="p-info p1-info" id="p1-info">
                <img class="p-photo" id="p1-photo" alt="P1">
                <div>
                    <div><span class="p-name" id="p1-name">JBLULIS</span><span class="cpu-badge" id="p1-cpu-badge" style="display:none">CPU</span></div>
                    <div class="p-score" id="p1-score">0</div>
                </div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="p-info p2-info" id="p2-info">
                <img class="p-photo" id="p2-photo" alt="P2">
                <div>
                    <div><span class="p-name" id="p2-name">ANABOZO</span><span class="cpu-badge" id="p2-cpu-badge" style="display:none">CPU</span></div>
                    <div class="p-score" id="p2-score">0</div>
                </div>
            </div>
        </div>

        <div class="turn-msg" id="turn-msg"></div>

        <div class="board" id="board">
            <div class="cell" onclick="move(0)" id="c0"></div>
            <div class="cell" onclick="move(1)" id="c1"></div>
            <div class="cell" onclick="move(2)" id="c2"></div>
            <div class="cell" onclick="move(3)" id="c3"></div>
            <div class="cell" onclick="move(4)" id="c4"></div>
            <div class="cell" onclick="move(5)" id="c5"></div>
            <div class="cell" onclick="move(6)" id="c6"></div>
            <div class="cell" onclick="move(7)" id="c7"></div>
            <div class="cell" onclick="move(8)" id="c8"></div>
        </div>

        <div style="text-align:center;margin-top:12px;">
            <button class="btn btn-sm" onclick="resetBoard()">🔄 Nova Rodada</button>
            <button class="btn btn-sm btn-gray" onclick="showScreen('setup')" style="margin-left:8px;">⚙️ Config</button>
        </div>

        <div class="history" id="history"></div>
    </div>
</div>

<!-- VICTORY -->
<div class="victory-overlay" id="victory-overlay">
    <div class="victory-box" id="victory-box">
        <div class="victory-title" id="v-title">GANHOU!</div>
        <div id="v-illustration"></div>
        <div class="victory-msg" id="v-msg"></div>
        <div class="icons-row" id="v-icons">🏆</div>
        <button class="btn" onclick="closeVictory()">🔄 JOGAR DE NOVO</button>
    </div>

const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

];
const DRAW_MSGS = [
    "Empate! Nem PT nem 22 venceu hoje! 🤝",
    "Deu empate! O Brasil dividido… 😅",
    "Nenhuma das duas ganhou! Revanche!"
];

window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('avatar1').src = IMG1;
    document.getElementById('avatar2').src = IMG2;
});

function loadPhoto(evt, p) {
    const file = evt.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = e => {
        imgs[p-1] = e.target.result;
        document.getElementById('avatar'+p).src = e.target.result;
    };
    r.readAsDataURL(file);
}



function selectSide(s) {
    humanSide = s;
    document.getElementById('btn-side1').classList.toggle('selected', s===1);
    document.getElementById('btn-side2').classList.toggle('selected', s===2);
}

function selectDiff(d) {
    difficulty = d;
    ['fudiav','solz','rr'].forEach(x => {
        document.getElementById('btn-'+x).classList.toggle('selected', x===d);
    });
}

function startGame() {
    vsComputer = true;
    humanPlayer = humanSide;
    names[0] = document.getElementById('name1').value || 'JBLULIS';
    names[1] = document.getElementById('name2').value || 'ANABOZO';
    document.getElementById('p1-name').textContent = names[0];
    document.getElementById('p2-name').textContent = names[1];
    document.getElementById('p1-photo').src = imgs[0];
    document.getElementById('p2-photo').src = imgs[1];
    // Show CPU badges
    const b1 = document.getElementById('p1-cpu-badge');
    const b2 = document.getElementById('p2-cpu-badge');
    if (b1) b1.style.display = (vsComputer && humanPlayer!==1) ? 'inline-block' : 'none';
    if (b2) b2.style.display = (vsComputer && humanPlayer!==2) ? 'inline-block' : 'none';
    scores = {1:0,2:0}; draws = 0; games = 0;
    showScreen('game');
    resetBoard();
}

function resetBoard() {
    board = Array(9).fill(null);
    turn = 1; active = true;
    for (let i=0;i<9;i++) {
        const c = document.getElementById('c'+i);
        c.innerHTML = '';
        c.classList.remove('taken','winner-cell');
    }
    updateActive();
    setTurnMsg();
    updateHistory();
    // If AI goes first (AI is player 1 and human is player 2)
    if (vsComputer && humanPlayer !== 1) {
        setTimeout(aiMove, {fudiav:8000,solz:4000,rr:600}[difficulty]||4000);
    }
}

function move(i) {
    if (!active || board[i]) return;
    if (vsComputer && turn !== humanPlayer) return; // block click during AI turn
    board[i] = turn;
    const cell = document.getElementById('c'+i);
    cell.classList.add('taken');
    const img = document.createElement('img');
    img.src = imgs[turn-1];
    img.className = 'cell-img';
    cell.appendChild(img);
    const result = check();
    if (result) { handleResult(result); return; }
    turn = turn===1?2:1;
    updateActive();
    setTurnMsg();
    if (vsComputer && turn !== humanPlayer) {
        setTimeout(aiMove, {fudiav:8000,solz:4000,rr:600}[difficulty]||4000);
    }
}

function aiMove() {
    if (!active) return;
    const aiP = 3 - humanPlayer;
    const empty = board.map((v,i)=>v?-1:i).filter(i=>i>=0);
    let idx = -1;

    if (difficulty === 'rr') {
        // Perfect play — full minimax
        idx = minimax(board, aiP, true).idx;
    } else if (difficulty === 'solz') {
        // Win if possible, block if needed, otherwise random
        idx = smartMove(aiP) ?? empty[Math.floor(Math.random()*empty.length)];
    } else {
        // FUDISVAl: 100% random, nem tenta
        idx = empty[Math.floor(Math.random()*empty.length)];
    }

    if (idx === -1 || idx === undefined) return;
    board[idx] = turn;
    const cell = document.getElementById('c'+idx);
    cell.classList.add('taken');
    const img = document.createElement('img');
    img.src = imgs[turn-1];
    img.className = 'cell-img';
    cell.appendChild(img);
    const result = check();
    if (result) { handleResult(result); return; }
    turn = humanPlayer;
    updateActive();
    setTurnMsg();
}

function smartMove(aiP) {
    const hP = humanPlayer;
    // Win immediately if possible
    for (const [a,b,c] of WINS) {
        const line = [board[a],board[b],board[c]];
        if (line.filter(v=>v===aiP).length===2 && line.includes(null)) {
            return [a,b,c][line.indexOf(null)];
        }
    }
    // Block human win
    for (const [a,b,c] of WINS) {
        const line = [board[a],board[b],board[c]];
        if (line.filter(v=>v===hP).length===2 && line.includes(null)) {
            return [a,b,c][line.indexOf(null)];
        }
    }
    return null;
}

function minimax(b, aiP, isMax) {
    const hP = humanPlayer;
    // Check terminal states
    for (const [a,bc,c] of WINS) {
        if (b[a] && b[a]===b[bc] && b[a]===b[c]) {
            return { score: b[a]===aiP ? 10 : -10, idx: -1 };
        }
    }
    const empty = b.map((v,i)=>v?-1:i).filter(i=>i>=0);
    if (!empty.length) return { score: 0, idx: -1 };

    let best = isMax ? { score: -Infinity, idx: -1 } : { score: Infinity, idx: -1 };
    const curP = isMax ? aiP : hP;
    for (const i of empty) {
        b[i] = curP;
        const res = minimax(b, aiP, !isMax);
        b[i] = null;
        if (isMax ? res.score > best.score : res.score < best.score) {
            best = { score: res.score, idx: i };
        }
    }
    return best;
}

function check() {
    for (const [a,b,c] of WINS)
        if (board[a] && board[a]===board[b] && board[a]===board[c])
            return {type:'win', player:board[a], combo:[a,b,c]};
    if (board.every(v=>v)) return {type:'draw'};
    return null;
}

function handleResult(r) {
    active = false; games++;
    if (r.type==='win') {
        r.combo.forEach(i=>document.getElementById('c'+i).classList.add('winner-cell'));
        scores[r.player]++;
        updateScores();
        updateHistory();
        setTimeout(()=>showVictory(r.player), 600);
    } else {
        draws++;
        updateHistory();
        const msg = DRAW_MSGS[Math.floor(Math.random()*DRAW_MSGS.length)];
        document.getElementById('turn-msg').textContent = msg;
        updateScores();
    }
}

function showVictory(p) {
    const box = document.getElementById('victory-box');
    box.className = 'victory-box win-p'+(p===1?'1':'2');
    document.getElementById('v-title').textContent = names[p-1]+' GANHOU! 🏆';
    document.getElementById('v-illustration').innerHTML = p===1 ? SVG_LULA : SVG_JUMENTO;
    const msgs = p===1 ? WIN_MSGS_1 : WIN_MSGS_2;
    document.getElementById('v-msg').textContent = msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('v-icons').textContent = p===1 ? '🔴💰🔴' : '💚🫏💛';
    document.getElementById('victory-overlay').classList.add('show');
    launchConfetti(p);
}

function closeVictory() {
    document.getElementById('victory-overlay').classList.remove('show');
    resetBoard();
}

function updateActive() {
    document.getElementById('p1-info').classList.toggle('active', turn===1);
    document.getElementById('p2-info').classList.toggle('active', turn===2);
}

function setTurnMsg() {
    if (vsComputer && turn !== humanPlayer) {
        const thinkMsgs = {
            fudiav: '🥚🤓 FUDISVAl: um, to pensando, vou já decidir, jaja decido, ei alguem decide por mim ai ?',
            solz:   '☀️ Solzinho: calma estou malhando, jaja jogo',
            rr:     '💀 RR: Calculando sua destruição...'
        };
        document.getElementById('turn-msg').textContent = thinkMsgs[difficulty] || thinkMsgs.solz;
        return;
    }
    const name = names[turn-1];
    const t1 = [`${name}, é sua vez! ⚽`, `Vai lá, ${name}! 🎯`, `${name} na jogada! 🔥`];
    document.getElementById('turn-msg').textContent = t1[Math.floor(Math.random()*t1.length)];
}

function updateScores() {
    document.getElementById('p1-score').textContent = scores[1];
    document.getElementById('p2-score').textContent = scores[2];
}

function updateHistory() {
    if (!games) { document.getElementById('history').textContent=''; return; }
    document.getElementById('history').textContent =
        `Rodadas: ${games} | ${names[0]}: ${scores[1]} | ${names[1]}: ${scores[2]} | Empates: ${draws}`;
}

function showScreen(n) {
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+n).classList.add('active');
}

function launchConfetti(p) {
    const colors = p===1
        ? ['#cc0000','#ff4444','#ffffff','#8b0000','#ffaaaa']
        : ['#009c3b','#ffdf00','#ffffff','#006622','#aaffcc'];
    for (let i=0;i<80;i++) {
        setTimeout(()=>{
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left = Math.random()*100+'vw';
            el.style.top = '-20px';
            el.style.background = colors[Math.floor(Math.random()*colors.length)];
            el.style.width = el.style.height = (Math.random()*8+5)+'px';
            el.style.borderRadius = Math.random()>.5?'50%':'2px';
            el.style.animationDuration = (Math.random()*2+1.5)+'s';
            document.body.appendChild(el);
            setTimeout(()=>el.remove(), 4000);
        }, i*40);
    }
}
